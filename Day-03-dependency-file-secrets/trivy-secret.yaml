rules:
  - id: postgresql-connection-string
    category: database
    title: PostgreSQL Connection String
    severity: HIGH
    keywords:
      - postgresql://
    regex: (?i)(?P<secret>postgresql://[^:]+:[^@]+@[^/]+/[^\s"']+)

  - id: aws-access-key-id
    category: cloud
    title: AWS Access Key ID
    severity: HIGH
    keywords:
      - AKIA
    regex: (?P<secret>AKIA[0-9A-Z]{16})

  - id: aws-secret-access-key
    category: cloud
    title: AWS Secret Access Key
    severity: HIGH
    keywords:
      - AWS_SECRET_ACCESS_KEY
    regex: (?i)(?P<secret>AWS_SECRET_ACCESS_KEY\s*=\s*["'][^"']+["'])