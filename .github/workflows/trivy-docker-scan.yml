name: docker image scanning using the trivy
on:
  workflow_dispatch:
jobs:
  docker-image-scanning:
    name: docker image scanning using the trivy
    runs-on: ubuntu-latest
    steps:
      - name: checkout the code
        uses: actions/checkout@v4

      - name: build docker image
        run: |
          docker build -t my-image: {{github.sha}} .

      - name: trivy seteup
        uses: aquasecurity/trivy-action@v0.2.3

      - name: scan docker image
        run: |
          trivy image --exit-code 1 --severity HIGH,CRITICAL my-image: {{github.sha}} 

      - name: upload trivy scan result
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-result

      - name: scan summary
        if: success()
        run: |
          echo "the scan completed successfully. No HIGH or CRITICAL vulnerabilities found."

      - name: upload the docker image to the github artifactory
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/my-image:{{github.sha}}