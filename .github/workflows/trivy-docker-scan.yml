name: docker image scanning using the trivy
on:
  workflow_dispatch:

jobs:
  docker-image-scanning:
    name: docker image scanning using the trivy
    runs-on: ubuntu-latest
    steps:
      - name: checkout the code
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key | \
            sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Verify Trivy
        run: trivy --version

      - name: build docker image
        run: |
          docker build -t my-image:${{ github.sha }} ./Day-02-docker-image-scan

      - name: scan docker image (report only)
        run: |
          trivy image --format table --output trivy-report.txt --severity HIGH,CRITICAL --ignore-unfixed my-image:${{ github.sha }}

      - name: upload trivy scan result
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-report
          path: trivy-report.txt

      - name: enforce gate (fail build on HIGH/CRITICAL)
        run: |
          trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed my-image:${{ github.sha }}

      - name: scan summary
        if: success()
        run: |
          echo "The scan completed successfully. No HIGH or CRITICAL fixable vulnerabilities found."

      - name: log in to GHCR
        if: success()
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: upload the docker image to the github artifactory
        if: success()
        uses: docker/build-push-action@v5
        with:
          context: ./Day-02-docker-image-scan
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/my-image:${{ github.sha }}