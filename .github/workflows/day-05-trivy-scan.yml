name: Trivy Security Scan

on:
  push:
    branches:
      - main
  pull_request:

env:
  APP_DIR: Day-05-Trivy-scan   # folder containing package.json and Dockerfile

jobs:
  trivy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install

      - name: Run tests
        working-directory: ${{ env.APP_DIR }}
        run: npm test

      - name: Build Docker Image
        working-directory: ${{ env.APP_DIR }}
        run: |
          docker build -t demo:${{ github.sha }} .

      # --- Explicit Trivy installation ---
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | \
            sh -s -- -b /usr/local/bin
          trivy --version

      # continue-on-error lets the job keep running even if vulnerabilities
      # are found, so the report always gets generated and uploaded below.
      - name: Trivy Image Scan (generate report)
        id: trivy_scan
        run: |
          trivy image demo:${{ github.sha }} \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            --output trivy-report.txt
        continue-on-error: true

      - name: Upload Trivy report to Nexus
        run: |
          REPORT_NAME="trivy-report-${{ github.sha }}.txt"
          curl -v -u "${{ secrets.NEXUS_USER }}:${{ secrets.NEXUS_PASS }}" \
            --upload-file trivy-report.txt \
            "${{ secrets.NEXUS_URL }}/repository/trivy-reports/${{ github.event.repository.name }}/${REPORT_NAME}"
        # No `if:` condition — always runs, clean or vulnerable scan.

      - name: Fail job if vulnerabilities found
        if: steps.trivy_scan.outcome == 'failure'
        run: |
          echo "❌ Trivy found HIGH/CRITICAL vulnerabilities. See uploaded report in Nexus."
          exit 1

      - name: Deploy
        if: success()
        run: echo "Add your deployment step here"