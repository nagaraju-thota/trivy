name: Trivy Security Scan

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-scan:
    name: Trivy Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # 1. Filesystem vulnerability scan
      - name: 1 - Filesystem Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
          format: table

      # 2. Dependency vulnerability scan
      - name: 2 - Dependency Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
          format: table

      # 3. Misconfiguration scan
      - name: 3 - Misconfiguration Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 0
          format: table

      # 4. Secret scan
      - name: 4 - Secret Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: HIGH,CRITICAL
          exit-code: 0
          format: table

      # Final security gate
      - name: Final Security Gate
        run: |
          echo "Running final security validation..."

          trivy fs \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            .

          trivy config \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            .

          echo "All security scans passed successfully."
